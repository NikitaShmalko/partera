name: Run Pytest

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:   # ← позволяет запускать вручную с кнопки "Run workflow"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --alluredir=allure-results